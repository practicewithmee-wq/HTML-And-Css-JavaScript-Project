<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div id="nav-Container">

        <div class="items">
            
            <img src="Netflix_Logo.png" alt="netflixlogo" class="nav-Logo">


            <div class="nav-Buttons">
            <select class="language">
                <option value="English" style="color:black;">English</option>
                <option value="Hindi" style="color:black;">Hindi</option>
            </select>
 
           
            

            <a href="#Sign_In" class="button">
                <button class="button">Sign In</button>
            </a>
            </div>

        </div>

        <div id="heading">
            <div class="heading">
            <h1>Unlimited movies, shows, and more</h1>
            <h4>Starts at ₹149. Cancel at any time.</h4>
            <P>Ready to watch? Enter your email to create or restart your membership.</P>
            </div>

            <div class="row-Btn">
            <form>
            <input type="text" id="fname" class="fname" name="fname" placeholder="Email address">
            </form>

            
            <a href="#">Get Started &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;></a>
            </div>

        </div>

    


    </div>

    
    <div class="curve-Border"></div>


    <div class="tranding">
        <h1>Trending Now</h1>
    </div>

    <div class="main-Container">
         <img src="it_image.jpg" alt="it image">
         <img src="it_image.jpg" alt="it image">
         <img src="it_image.jpg" alt="it image">
    </div>

</body>
</html>
